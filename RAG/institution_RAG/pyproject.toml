[project]
name = "institution-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "msalman6927", email = "m69278495@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "google-genai>=2.27.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.6",
    "langchain-protocol>=0.0.19",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
institution-rag = "institution_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
