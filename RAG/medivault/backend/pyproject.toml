[project]
name = "medivault"
version = "0.1.0"
description = "MediVault — agentic clinical RAG backend for doctors (hybrid retrieval + GraphRAG + LangGraph agent)"
readme = "README.md"
authors = [
    { name = "msalman6927", email = "m69278495@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "chromadb>=1.0.0",
    "fastapi>=0.141.1",
    "google-genai>=2.27.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=2.0.0",
    "langgraph>=1.0.0",
    "pypdf>=6.19.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.16.0",
    "sqlalchemy[asyncio]>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["medivault"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not eval'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that need live Postgres/Chroma (run with -m integration)",
    "eval: LLM smoke-eval questions (need live Gemini; run with -m eval)",
]
filterwarnings = ["ignore::DeprecationWarning"]
